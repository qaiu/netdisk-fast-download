name: 部署或运行问题
description: 程序无法启动、页面打不开、配置或运行报错。不是某一个分享解析失败。
title: "[运行问题] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        单个分享解析失败请改用「解析失败」。

        不要粘贴 Cookie、Authorization、refresh_token、access token、网盘或后台密码、个人信息，以及未打码的配置。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前
      options:
        - label: 我查过现有 issue，没有找到相同问题
          required: true
        - label: 我看过当前版本和更新说明
          required: true
        - label: 日志和配置已经去掉令牌、密码和个人信息
          required: true
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 例如 0.4.11。不确定就写获取方式。
      placeholder: "0.4.11"
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 本机发布包（Linux）
        - 本机发布包（Windows）
        - Docker
        - 自行编译
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统环境
      description: 操作系统、架构，以及是否用了代理。没有就写「未记录」。
      placeholder: "例如 Ubuntu 22.04 x86_64"
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 服务应正常启动，页面可以打开
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 启动后立即退出，或页面无法访问
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 下载并解压对应版本
        2. 按文档启动
        3. 看到上述结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的报错日志
      description: 没有日志就写「无」。不要包含令牌、密码或完整私有配置。
      render: shell
      placeholder: 无
    validations:
      required: true
