name: 功能建议
description: 新功能或改进建议。不需要填写报错、日志或分享链接。
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        这里只讨论建议。解析失败或程序跑不起来，请分别使用对应模板。

        如果要举例，只用可公开的测试分享，不要附带账号、令牌或私人文件。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前
      options:
        - label: 我查过现有 issue，没有找到相同建议
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      placeholder: 现在做什么不方便
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议怎么做
      placeholder: 希望增加或改变什么
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 还可以怎么做
      description: 没有就留空。
    validations:
      required: false
