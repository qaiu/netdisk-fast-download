name: 解析失败
description: 某个分享链接解析失败、列目录失败，或直链无法下载
title: "[解析失败] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        只提交可以公开的测试分享。私人文件、含个人信息的分享不要发到这里。

        不要粘贴 Cookie、Authorization、refresh_token、access token、网盘账号密码、后台密码，或未打码的配置。提取码、访问密码和账号密码不是一回事：下面只接受分享本身的提取码或访问密码。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前
      options:
        - label: 我查过现有 issue，没有找到相同问题
          required: true
        - label: 我看过当前版本和更新说明，这不是已经修好的问题
          required: true
        - label: 分享可以公开，且没有附带令牌、Cookie、账号密码或未脱敏配置
          required: true
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 页面上的版本，或发布包名里的版本，例如 0.4.12。
      placeholder: "0.4.12"
    validations:
      required: true
  - type: dropdown
    id: pan
    attributes:
      label: 网盘类型
      options:
        - 蓝奏云
        - 蓝奏云优享
        - 城通网盘
        - 永硕 E 盘
        - 123云盘
        - 夸克网盘
        - UC网盘
        - 小飞机盘
        - 其他（在现象里补充名称）
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 本机发布包
        - Docker
        - 自行编译
        - 公共站点
        - 其他
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 分享内容
      options:
        - 单文件
        - 目录
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: 分享是否带密码
      description: 提取码是分享链接自带的短码。不要填写网盘登录密码。
      options:
        - 无密码
        - 只有提取码
        - 有访问密码
        - 不确定
    validations:
      required: true
  - type: input
    id: passcode
    attributes:
      label: 提取码或访问密码
      description: 没有就留空。这里不是账号密码。
      placeholder: "例如 abcd"
    validations:
      required: false
  - type: input
    id: share-url
    attributes:
      label: 可公开的完整分享链接
      description: 用专门准备的测试分享。没有可公开链接时留空，并在下一项说明原因。
      placeholder: "https://"
    validations:
      required: false
  - type: textarea
    id: no-share-reason
    attributes:
      label: 不能提供测试分享的原因
      description: 已经填写链接就留空。
      placeholder: 例如分享含私人文件，只能描述现象
    validations:
      required: false
  - type: checkboxes
    id: share-or-reason
    attributes:
      label: 链接
      options:
        - label: 我填写了可公开的完整分享链接，或已经说明不能提供的原因
          required: true
  - type: dropdown
    id: official
    attributes:
      label: 官方网页是否可用
      options:
        - 可以打开，并且能下载
        - 可以打开，但不能下载
        - 打不开或提示失效
        - 还没在官方网页试过
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 应解析出直链，或列出目录中的文件
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 写页面或接口返回的原文。不要贴令牌。
      placeholder: 例如提示分享不存在，或直链返回 403
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 使用上述版本和部署方式
        2. 解析这个分享
        3. 看到上述结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的报错日志
      description: 没有日志就写「无」。删除 Cookie、Authorization、token、密码和未脱敏配置后再粘贴。
      render: shell
      placeholder: 无
    validations:
      required: true
